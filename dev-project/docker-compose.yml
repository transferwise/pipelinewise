services:
  ### Primary container with PipelineWise CLI
  pipelinewise:
    # entrypoint.sh installs amd64-only .debs (mongosh, mongodb-database-tools),
    # so arm64 hosts emulate.
    platform: linux/amd64
    image: ubuntu:24.04
    container_name: pipelinewise
    working_dir: /opt/pipelinewise
    entrypoint: /opt/pipelinewise/dev-project/entrypoint.sh
    env_file:
      - .env
    environment:
      # Literal, not ${PATH}: Compose would interpolate ${PATH} from the host shell,
      # baking the developer's machine paths into the container.
      PATH: /opt/pipelinewise/dev-project/.virtualenvs/pipelinewise/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PIPELINEWISE_BACKEND_HOST: ${PIPELINEWISE_BACKEND_HOST:-pipelinewise-backend-db}
      PIPELINEWISE_BACKEND_PORT: ${PIPELINEWISE_BACKEND_PORT:-5432}
      PIPELINEWISE_BACKEND_USER: ${PIPELINEWISE_BACKEND_USER:-pipelinewise_backend}
      PIPELINEWISE_BACKEND_PASSWORD: ${PIPELINEWISE_BACKEND_PASSWORD:-backend-secret}
      PIPELINEWISE_BACKEND_DB: ${PIPELINEWISE_BACKEND_DB:-pipelinewise_backend}
      TAP_ORACLE_MYSQL_HOST: ${TAP_ORACLE_MYSQL_HOST:-pipelinewise-oracle-mysql-source}
      TAP_ORACLE_MYSQL_PORT: ${TAP_ORACLE_MYSQL_PORT:-3306}
      TAP_ORACLE_MYSQL_PORT_ON_HOST: ${TAP_ORACLE_MYSQL_PORT_ON_HOST:-13307}
      TAP_ORACLE_MYSQL_ROOT_PASSWORD: ${TAP_ORACLE_MYSQL_ROOT_PASSWORD:-secret}
      TAP_ORACLE_MYSQL_USER: ${TAP_ORACLE_MYSQL_USER:-pipelinewise}
      TAP_ORACLE_MYSQL_PASSWORD: ${TAP_ORACLE_MYSQL_PASSWORD:-secret}
      TAP_ORACLE_MYSQL_DB: ${TAP_ORACLE_MYSQL_DB:-mysql8_source_db}
    volumes:
      - ../:/opt/pipelinewise
      # don't create container specific .virtualenvs files on host
      - /opt/pipelinewise/dev-project/.virtualenvs/
      # mount pipelinewise pipe configuration directory to host for ease of troubleshooting
      - .pipelinewise:/root/.pipelinewise
      # Gitignored; Docker creates an empty directory here when the host file is absent.
      - ./snowflake.pem:/opt/pipelinewise/.ssh/snowflake.pem

    depends_on:
      pipelinewise-postgres-source:
        condition: service_healthy
      pipelinewise-yugabyte-source:
        condition: service_healthy
      pipelinewise-mysql-source:
        condition: service_healthy
      pipelinewise-oracle-mysql-source:
        condition: service_healthy
      pipelinewise-postgres-target:
        condition: service_healthy
      pipelinewise-backend-db:
        condition: service_healthy
      pipelinewise-mongodb-source:
        condition: service_healthy
    networks:
      - pipelinewise_network
      - pipelinewise_backend_network

  ### PipelineWise internal services
  # data-diff operational state. Isolated from the replicated target on purpose:
  # separate server, role, database, port and volume.
  pipelinewise-backend-db:
    image: postgres:16-alpine
    container_name: pipelinewise-backend-db
    ports:
      # 15432 is off limits: occupied on developer machines, compose cannot bind it.
      - ${PIPELINEWISE_BACKEND_PORT_ON_HOST:-15433}:${PIPELINEWISE_BACKEND_PORT:-5432}
    environment:
      # The superuser is the DDL role that owns the schema and runs migrations.
      POSTGRES_USER: ${PIPELINEWISE_BACKEND_DDL_USER:-pipelinewise_ddl}
      POSTGRES_PASSWORD: ${PIPELINEWISE_BACKEND_DDL_PASSWORD:-ddl-secret}
      POSTGRES_DB: ${PIPELINEWISE_BACKEND_DB:-pipelinewise_backend}
      PIPELINEWISE_BACKEND_APP_USER: ${PIPELINEWISE_BACKEND_USER:-pipelinewise_backend}
      PIPELINEWISE_BACKEND_APP_PASSWORD: ${PIPELINEWISE_BACKEND_PASSWORD:-backend-secret}
    volumes:
      - pipelinewise-backend-data:/var/lib/postgresql/data
      - ./backend-db/init-application-role.sh:/docker-entrypoint-initdb.d/init-application-role.sh
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${PIPELINEWISE_BACKEND_DDL_USER:-pipelinewise_ddl} -d ${PIPELINEWISE_BACKEND_DB:-pipelinewise_backend}
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pipelinewise_backend_network

  ### TAP (Data source) containers
  # PostgreSQL service container used as test source database
  # Using Debezium image with wal2json plugin for logical decoding
  pipelinewise-postgres-source:
    build:
      context: ./pg
      dockerfile: Dockerfile
      # The Dockerfile clones wal2json from GitHub, which fails behind some
      # corporate proxy/DNS setups on the default bridge network.
      network: host
    container_name: pipelinewise-postgres-source
    volumes:
      - ./pg/pg_hba.conf:/var/lib/postgresql/pg_hba.conf
    # Enable logical decoding, including wal2json in the base-image allowlist, and SSL.
    command: >
      -c "wal_level=logical"
      -c "output_plugin_libraries=pgoutput,test_decoding,decoderbufs,wal2json"
      -c "max_replication_slots=5"
      -c "max_wal_senders=5"
      -c "ssl=on"
      -c "ssl_cert_file=/var/lib/postgresql/server.crt"
      -c "ssl_key_file=/var/lib/postgresql/server.key"
      -c "hba_file=/var/lib/postgresql/pg_hba.conf"
    ports:
      - ${TAP_POSTGRES_PORT_ON_HOST}:${TAP_POSTGRES_PORT}
    environment:
      POSTGRES_USER: ${TAP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TAP_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TAP_POSTGRES_DB}
    healthcheck:
      # Unix socket, so unaffected by the hostssl-only rules in pg_hba.conf.
      test:
        - CMD-SHELL
        - pg_isready -U ${TAP_POSTGRES_USER} -d ${TAP_POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - pipelinewise_network


  pipelinewise-yugabyte-source:
    image: yugabytedb/yugabyte:2026.1.1.1-b2
    container_name: pipelinewise-yugabyte-source
    command: >
      bin/yugabyted start --background=false
    ports:
      - ${TAP_YUGABYTE_PORT_ON_HOST}:${TAP_YUGABYTE_PORT}
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "bin/yugabyted status | grep -q 'Status.*Running'",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - pipelinewise_network

  # MySQL service container used as test source database
  pipelinewise-mysql-source:
    image: mariadb:10.6.18
    container_name: pipelinewise-mysql-source
    ports:
      - ${TAP_MYSQL_PORT_ON_HOST}:${TAP_MYSQL_PORT}
    volumes:
      - ./my/server-cert.pem:/etc/my.cnf.d/certificates/server-cert.pem
      - ./my/server-key.pem:/etc/my.cnf.d/certificates/server-key.pem
      - ./my/ca-cert.pem:/etc/my.cnf.d/certificates/ca-cert.pem
    command: >
      --default-authentication-plugin=mysql_native_password
      --performance_schema=ON
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-do-db=${TAP_MYSQL_DB}
      --binlog-do-db=${TAP_MYSQL_REPLICA_DB}
      --max-allowed-packet=64M
      --tls_version=TLSv1.2
      --require_secure_transport=ON
      --ssl_cert=/etc/my.cnf.d/certificates/server-cert.pem
      --ssl_key=/etc/my.cnf.d/certificates/server-key.pem
      --ssl_ca=/etc/my.cnf.d/certificates/ca-cert.pem
    environment:
      MYSQL_ROOT_PASSWORD: ${TAP_MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${TAP_MYSQL_USER}
      MYSQL_PASSWORD: ${TAP_MYSQL_PASSWORD}
      MYSQL_DATABASE: ${TAP_MYSQL_DB}
    healthcheck:
      # Over TCP, not the socket, to exercise require_secure_transport=ON.
      # $$ escapes Compose interpolation so the shell expands it.
      test:
        - CMD-SHELL
        - mariadb-admin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pipelinewise_network

  pipelinewise-mysql-source-replica:
    image: mariadb:10.6.18
    container_name: pipelinewise-mysql-source-replica
    ports:
      - ${TAP_MYSQL_REPLICA_PORT_ON_HOST}:${TAP_MYSQL_REPLICA_PORT}
    command: --default-authentication-plugin=mysql_native_password --server-id=2 --log-bin=mysql-bin --relay-log=mysql-relay-log --replicate-do-db=${TAP_MYSQL_REPLICA_DB}
    environment:
      MYSQL_ROOT_PASSWORD: ${TAP_MYSQL_REPLICA_ROOT_PASSWORD}
      MYSQL_USER: ${TAP_MYSQL_REPLICA_USER}
      MYSQL_PASSWORD: ${TAP_MYSQL_REPLICA_PASSWORD}
      MYSQL_DATABASE: ${TAP_MYSQL_REPLICA_DB}
    networks:
      - pipelinewise_network

  # Genuine Oracle MySQL service, kept separate from MariaDB so engine-specific
  # compatibility claims are backed by the named database.
  pipelinewise-oracle-mysql-source:
    image: mysql:8.0.39
    container_name: pipelinewise-oracle-mysql-source
    ports:
      - ${TAP_ORACLE_MYSQL_PORT_ON_HOST:-13307}:${TAP_ORACLE_MYSQL_PORT:-3306}
    volumes:
      - ./my/server-cert.pem:/etc/mysql/certificates/server-cert.pem
      - ./my/server-key.pem:/etc/mysql/certificates/server-key.pem
      - ./my/ca-cert.pem:/etc/mysql/certificates/ca-cert.pem
    command: >
      --default-authentication-plugin=mysql_native_password
      --performance-schema=ON
      --server-id=3
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
      --binlog-do-db=${TAP_ORACLE_MYSQL_DB:-mysql8_source_db}
      --require-secure-transport=ON
      --ssl-cert=/etc/mysql/certificates/server-cert.pem
      --ssl-key=/etc/mysql/certificates/server-key.pem
      --ssl-ca=/etc/mysql/certificates/ca-cert.pem
    environment:
      MYSQL_ROOT_PASSWORD: ${TAP_ORACLE_MYSQL_ROOT_PASSWORD:-secret}
      MYSQL_USER: ${TAP_ORACLE_MYSQL_USER:-pipelinewise}
      MYSQL_PASSWORD: ${TAP_ORACLE_MYSQL_PASSWORD:-secret}
      MYSQL_DATABASE: ${TAP_ORACLE_MYSQL_DB:-mysql8_source_db}
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pipelinewise_network

  pipelinewise-mongodb-source:
    container_name: pipelinewise-mongodb-source
    build:
      context: ./mongo
      dockerfile: Dockerfile
    ports:
      - ${TAP_MONGODB_PORT_ON_HOST}:${TAP_MONGODB_PORT}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${TAP_MONGODB_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${TAP_MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${TAP_MONGODB_DB}
      MONGO_USERNAME: ${TAP_MONGODB_USER}
      MONGO_PASSWORD: ${TAP_MONGODB_PASSWORD}
      MONGO_REPLICA_HOST: pipelinewise-mongodb-source
    healthcheck:
      # Bare ping, not rs.status(): rs0 is initiated from the pipelinewise container,
      # which waits on this healthcheck, so checking for a replica set would deadlock.
      test:
        - CMD-SHELL
        - mongosh --quiet --tls --tlsAllowInvalidCertificates --eval 'db.adminCommand({ping:1}).ok' | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 20
    command: >
      mongod
      --bind_ip_all
      --replSet rs0
      --keyFile /etc/ssl/replica.key
      --tlsMode requireTLS
      --tlsAllowConnectionsWithoutCertificates
      --tlsCertificateKeyFile /etc/ssl/mongodb.pem
      --tlsAllowInvalidHostnames
      --tlsCAFile /etc/ssl/rootCA.pem
      --quiet
    networks:
      - pipelinewise_network

  ### Target containers
  # PostgreSQL service container used as test target database
  pipelinewise-postgres-target:
    image: postgres:16-alpine
    container_name: pipelinewise-postgres-target
    ports:
      - ${TARGET_POSTGRES_PORT_ON_HOST}:${TARGET_POSTGRES_PORT}
    environment:
      POSTGRES_USER: ${TARGET_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TARGET_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TARGET_POSTGRES_DB}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${TARGET_POSTGRES_USER} -d ${TARGET_POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - pipelinewise_network

networks:
  pipelinewise_network:
    ipam:
      driver: default
      config:
        - subnet: 192.168.56.0/24
  pipelinewise_backend_network:
    driver: bridge

volumes:
  pipelinewise-backend-data:
    name: pipelinewise-backend-data
