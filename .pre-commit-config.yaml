repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check --fix
        language: system
        types: [python]
        exclude: ^singer-connectors/(tap-(github|jira|kafka|mixpanel|mongodb|s3-csv|salesforce|slack|snowflake|twilio|zendesk)|target-(postgres|s3-csv)|transform-field)/
      - id: ruff-format
        name: Ruff format
        entry: ruff format
        language: system
        types: [python]
        exclude: ^singer-connectors/(tap-(github|jira|kafka|mixpanel|mongodb|s3-csv|salesforce|slack|snowflake|twilio|zendesk)|target-(postgres|s3-csv)|transform-field)/
