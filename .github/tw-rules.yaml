runChecks: true

actions:
  repo-settings:
    deleteBranchOnMerge: true
  branch-protection-settings:
    branches:
      - name: master
        dismissStaleReviews: true
        numRequiredReviews: 1
        requireLinearHistory: true
        requireConversationResolution: true
        requireBranchUpToDate: true
        restrictMerge:
          teams:
            - name: analytics-platform
            - name: machine-users
        checks:
          - name: lint_and_test
            type: tests
          - name: test_install_connectors
            type: tests
          - name: publish
            type: tests
          - name: e2e_tests_target_pg
            type: tests
          - name: e2e_tests_sf_conversion
            type: tests
          - name: e2e_tests_sf_publication
            type: tests
          - name: e2e_tests_sf_pg_partial
            type: tests
          - name: e2e_tests_sf_mariadb_partial
            type: tests
          - name: e2e_tests_sf_pg_iceberg
            type: tests
          - name: e2e_tests_sf_mariadb_iceberg
            type: tests
          - name: e2e_tests_sf_mysql_iceberg
            type: tests
          - name: e2e_tests_sf_mariadb_native
            type: tests

  sync-codeowners:
    extraWriters:
      - full-time-technical-staff
      - machine-users
