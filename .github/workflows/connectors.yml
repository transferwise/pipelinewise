# Workflow to check if all singer connectors are installable
name: Singer connectors

on:
  pull_request:
    branches: [master]

  workflow_dispatch:

concurrency:
  group: singer-connectors-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test_install_connectors:
    runs-on: ubuntu-24.04

    steps:
      - name: Checking out repo
        uses: actions/checkout@v7

      - name: Check if python changes are present
        id: check
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        continue-on-error: true
        run: ./scripts/ci_check_no_file_changes.sh python

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check PipelineWise and all connectors are installable
        run: |
          make pipelinewise_no_test_extras all_connectors

  test_connector_units:
    name: Unit tests (${{ matrix.connector }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - connector: tap-mysql
            test_target: unit_test_cov
          - connector: tap-postgres
            test_target: unit_test_cov
          - connector: tap-yugabyte
            test_target: unit_test_cov
          - connector: target-snowflake
            test_target: unit_test
          - connector: target-postgres
            test_target: unit_test

    steps:
      - name: Checking out repo
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            singer-connectors/${{ matrix.connector }}/setup.py
            singer-connectors/singer-python/setup.py

      - name: Install connector test dependencies
        run: make venv
        working-directory: singer-connectors/${{ matrix.connector }}

      - name: Run connector unit tests
        run: make ${{ matrix.test_target }}
        working-directory: singer-connectors/${{ matrix.connector }}

  test_shared_singer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test vendored Singer
        run: make -C singer-connectors/singer-python venv lint unit_test
      - name: Test transformations
        run: make -C singer-connectors/transform-field venv lint unit_test integration_test
      - name: Test MongoDB source logging
        run: |
          python -m venv singer-connectors/tap-mongodb/venv
          singer-connectors/tap-mongodb/venv/bin/python -m pip install \
            -e singer-connectors/singer-python -e 'singer-connectors/tap-mongodb[test]'
          singer-connectors/tap-mongodb/venv/bin/python -m pytest -v \
            singer-connectors/tap-mongodb/tests/test_logging.py

  test_tap_yugabyte_index_check:
    name: Integration tests (tap-yugabyte index check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checking out repo
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            singer-connectors/tap-yugabyte/setup.py
            singer-connectors/singer-python/setup.py

      # a service container cannot pass the `yugabyted start` command, so reuse the compose file
      - name: Start YugabyteDB
        run: docker compose -f singer-connectors/tap-yugabyte/docker-compose.yml up -d --wait

      - name: Install connector test dependencies
        run: make venv
        working-directory: singer-connectors/tap-yugabyte

      - name: Run index check integration tests
        working-directory: singer-connectors/tap-yugabyte
        env:
          COVERAGE_FILE: .coverage.index_check
        run: |
          cp tests/integration/env.template tests/integration/env
          . ./venv/bin/activate
          . ./tests/integration/env
          coverage run --source=tap_yugabyte -m pytest -v tests/integration/test_index_check.py
          coverage report

  connector_tests:
    name: connector_tests
    if: ${{ always() }}
    needs:
      - test_connector_units
      - test_shared_singer
      - test_tap_yugabyte_index_check
    runs-on: ubuntu-24.04
    steps:
      - name: Require connector test success
        env:
          CONNECTOR_UNITS_RESULT: ${{ needs.test_connector_units.result }}
          SHARED_SINGER_RESULT: ${{ needs.test_shared_singer.result }}
          YUGABYTE_INDEX_CHECK_RESULT: ${{ needs.test_tap_yugabyte_index_check.result }}
        run: |
          test "$CONNECTOR_UNITS_RESULT" = success
          test "$SHARED_SINGER_RESULT" = success
          test "$YUGABYTE_INDEX_CHECK_RESULT" = success
