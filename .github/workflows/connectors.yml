# Workflow to check if all singer connectors are installable
name: Singer connectors

on:
  pull_request:
    branches: [master]

  workflow_dispatch:

concurrency:
  group: singer-connectors-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test_install_connectors:
    runs-on: ubuntu-24.04

    steps:
      - name: Checking out repo
        uses: actions/checkout@v7

      - name: Check if python changes are present
        id: check
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        continue-on-error: true
        run: ./scripts/ci_check_no_file_changes.sh python

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check PipelineWise and all connectors are installable
        run: |
          make pipelinewise_no_test_extras all_connectors

  test_connector_units:
    name: Unit tests (${{ matrix.connector }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - connector: tap-mysql
            test_target: unit_test_cov
          - connector: tap-postgres
            test_target: unit_test_cov
          - connector: target-snowflake
            test_target: unit_test

    steps:
      - name: Checking out repo
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: singer-connectors/${{ matrix.connector }}/setup.py

      - name: Install connector test dependencies
        run: make venv
        working-directory: singer-connectors/${{ matrix.connector }}

      - name: Run connector unit tests
        run: make ${{ matrix.test_target }}
        working-directory: singer-connectors/${{ matrix.connector }}
