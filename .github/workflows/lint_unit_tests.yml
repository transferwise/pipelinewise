name: Lint and Unit Tests

on:
  pull_request:
    branches: [master]

  workflow_dispatch:

concurrency:
  group: lint_unit_tests-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint_and_test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checking out repo
        uses: actions/checkout@v7

      - name: Check if python changes are present
        id: check
        env:
          GITHUB_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        continue-on-error: true
        run: ./scripts/ci_check_no_file_changes.sh python config

      - name: Set up Python 3.12
        if: steps.check.outcome == 'failure'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.check.outcome == 'failure'
        run: make pipelinewise

      - name: Check code formatting
        if: steps.check.outcome == 'failure'
        run: |
          . .virtualenvs/pipelinewise/bin/activate
          ruff format --check .

      - name: Lint Python
        if: steps.check.outcome == 'failure'
        run: |
          . .virtualenvs/pipelinewise/bin/activate
          ruff check .

      - name: Run Unit tests
        if: steps.check.outcome == 'failure'
        run: |
          . .virtualenvs/pipelinewise/bin/activate
          pytest --cov=pipelinewise --cov-fail-under=77 -v tests/units

      # dev-project is the config the docs tell users to copy, and nothing else in
      # CI parses it. Catches schema violations and stale table references.
      - name: Validate dev-project configuration
        if: steps.check.outcome == 'failure'
        run: |
          . .virtualenvs/pipelinewise/bin/activate
          cp dev-project/.env.template dev-project/.env
          set -a && . dev-project/.env && set +a
          pipelinewise validate --dir dev-project/pipelinewise-config
