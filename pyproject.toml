[tool.ruff]
line-length = 120
force-exclude = true
# Connector suites outside GitHub connector CI remain out of scope.
extend-exclude = [
    "singer-connectors/tap-github/tests",
    "singer-connectors/tap-kafka/tests",
    "singer-connectors/tap-mixpanel/tests",
    "singer-connectors/tap-mongodb/tests/test_connection_string.py",
    "singer-connectors/tap-mongodb/tests/sync_strategies/test_change_streams.py",
    "singer-connectors/tap-mongodb/tests/sync_strategies/test_common.py",
    "singer-connectors/tap-mysql/tests/integration/test_binlog_boundaries.py",
    "singer-connectors/tap-mysql/tests/integration/test_binlog_recovery.py",
    "singer-connectors/tap-mysql/tests/integration/test_full_table_interruption.py",
    "singer-connectors/tap-mysql/tests/integration/test_tap_mysql.py",
    "singer-connectors/tap-mysql/tests/integration/utils.py",
    "singer-connectors/tap-postgres/tests/integration/test_discovery.py",
    "singer-connectors/tap-postgres/tests/integration/test_logical_replication.py",
    "singer-connectors/tap-postgres/tests/integration/test_streams_utils.py",
    "singer-connectors/tap-postgres/tests/integration/test_unsupported_pk.py",
    "singer-connectors/tap-s3-csv/tests",
    "singer-connectors/tap-slack/tests",
    "singer-connectors/tap-snowflake/tests",
    "singer-connectors/tap-twilio/tests",
    "singer-connectors/tap-zendesk/spikes",
    "singer-connectors/tap-zendesk/test",
    "singer-connectors/target-postgres/tests/integration/test_target_postgres.py",
    "singer-connectors/target-postgres/tests/integration/utils.py",
    "singer-connectors/target-s3-csv/tests",
    "singer-connectors/target-snowflake/tests/integration/test_iceberg_v3.py",
    "singer-connectors/target-snowflake/tests/integration/test_target_snowflake.py",
    "singer-connectors/target-snowflake/tests/integration/utils.py",
    "singer-connectors/transform-field/tests/integration",
]

[tool.ruff.lint]
# Keep high-confidence Pylint-category errors; porting legacy convention, refactor, and warning policy is out of scope.
select = ["E", "F", "W", "C90", "Q002", "PLE"]
preview = true
explicit-preview-rules = true
extend-select = ["E301", "E302", "E303", "E304", "E305", "E306"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# The former root complexity gate inspected production code only.
"tests/**/*.py" = ["C901"]
"tests/units/cli/test_cli.py" = ["E501"]
